<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>ERD rút gọn — Nội dung tĩnh (Thư viện / Học Vụ)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; color: #1f2328; width: 100vw; overflow: hidden; }
  #title { padding: 20px 24px 4px; }
  #title h1 { font-size: 18px; font-weight: 700; }
  #title p { font-size: 12px; color: #656d76; margin-top: 4px; }
  #note {
    position: absolute; left: 30px; top: 340px; width: 460px;
    font-size: 11px; color: #656d76; background: #f6f8fa;
    border: 1px dashed #d0d7de; border-radius: 8px; padding: 10px 12px; line-height: 1.5;
  }
  #note b { color: #1f2328; }
  #canvas-wrap { position: relative; margin-top: 70px; }
  #canvas { position: relative; }
  #svg-lines { position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible; }
  .table-card {
    position: absolute; width: 210px; background: #ffffff; border: 1px solid #d0d7de;
    border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.08); z-index: 10;
  }
  .card-header {
    padding: 8px 12px; border-radius: 9px 9px 0 0; display: flex; align-items: center; gap: 7px;
    border-bottom: 1px solid #d0d7de;
  }
  .card-header .dot { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
  .card-header .table-name { font-family: 'Consolas', 'JetBrains Mono', monospace; font-size: 12.5px; font-weight: 700; flex: 1; }
  .card-header .role-tag { font-size: 9px; font-weight: 700; color: #fff; padding: 2px 6px; border-radius: 10px; }
  .card-body { padding: 5px 0; }
  .field-row { display: flex; align-items: center; gap: 7px; padding: 3px 12px; font-size: 10.5px; }
  .field-badge { font-family: 'Consolas', monospace; font-size: 8px; font-weight: 700; padding: 1px 5px; border-radius: 3px; min-width: 22px; text-align: center; }
  .pk { background: #ffe8e0; color: #cf3b1d; }
  .fk { background: #dbeeff; color: #1868b8; }
  .fd { background: transparent; color: transparent; min-width: 22px; }
  .field-name { font-family: 'Consolas', monospace; flex: 1; }
  .field-type { color: #8c959f; font-size: 9.5px; }
</style>
</head>
<body>

<div id="title">
  <h1>Sơ đồ rút gọn — Nội dung tĩnh (Thư viện / Học Vụ)</h1>
  <p>Xem: cả 3 vai trò · Quản lý (thêm/sửa): Admin</p>
</div>

<div id="note">
  Chỉ 1 bảng, không có khoá ngoại tới bảng khác. <b>khu_vuc</b> là chuỗi
  tự do phân loại khu vực hiển thị (vd "thu-vien", "hoc-vu") — không
  phải khoá ngoại tới 1 bảng "khu vực" riêng.
</div>

<div id="canvas-wrap">
  <div id="canvas">
    <svg id="svg-lines" width="500" height="260"></svg>
  </div>
</div>

<script>
const TABLES = {
  noi_dung_tinh: {
    color: '#57606a', roleTag: null,
    fields: [
      { k: 'pk', n: 'id', t: 'int' },
      { n: 'khu_vuc', t: 'varchar' },
      { n: 'ma_muc', t: 'varchar' },
      { n: 'tieu_de', t: 'varchar' },
      { n: 'noi_dung', t: 'text' },
      { n: 'thu_tu', t: 'int' },
    ],
  },
};

const POSITIONS = {
  noi_dung_tinh: { x: 30, y: 20 },
};

const RELATIONS = [];

const canvas = document.getElementById('canvas');
const cardEls = {};

Object.entries(TABLES).forEach(([name, def]) => {
  const pos = POSITIONS[name];
  const card = document.createElement('div');
  card.className = 'table-card';
  card.id = 'tbl_' + name;
  card.style.left = pos.x + 'px';
  card.style.top = pos.y + 'px';
  const fieldsHTML = def.fields.map(f => `
    <div class="field-row">
      <span class="field-badge ${f.k || 'fd'}">${f.k ? f.k.toUpperCase() : ''}</span>
      <span class="field-name">${f.n}</span>
      <span class="field-type">${f.t}</span>
    </div>`).join('');
  card.innerHTML = `
    <div class="card-header" style="background:${def.color}14; border-bottom-color:${def.color}44;">
      <div class="dot" style="background:${def.color};"></div>
      <span class="table-name">${name}</span>
      ${def.roleTag ? `<span class="role-tag" style="background:${def.color};">${def.roleTag}</span>` : ''}
    </div>
    <div class="card-body">${fieldsHTML}</div>
  `;
  canvas.appendChild(card);
  cardEls[name] = card;
});
</script>
</body>
</html>
