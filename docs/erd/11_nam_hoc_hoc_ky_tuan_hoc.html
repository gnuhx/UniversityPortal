<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>ERD rút gọn — Năm học, Học kỳ &amp; Tuần học</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; color: #1f2328; width: 100vw; overflow: hidden; }
  #title { padding: 20px 24px 4px; }
  #title h1 { font-size: 18px; font-weight: 700; }
  #title p { font-size: 12px; color: #656d76; margin-top: 4px; }
  #canvas-wrap { position: relative; margin-top: 70px; }
  #canvas { position: relative; }
  #svg-lines { position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible; }
  .rel-line { fill: none; stroke: #8c959f; stroke-width: 1.6; }
  .rel-label { font-size: 10px; fill: #57606a; font-family: 'Segoe UI', Arial, sans-serif; }
  .rel-label-bg { fill: #ffffff; opacity: 0.9; }
  .table-card {
    position: absolute; width: 210px; background: #ffffff; border: 1px solid #d0d7de;
    border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.08); z-index: 10;
  }
  .card-header {
    padding: 8px 12px; border-radius: 9px 9px 0 0; display: flex; align-items: center; gap: 7px;
    border-bottom: 1px solid #d0d7de;
  }
  .card-header .dot { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
  .card-header .table-name { font-family: 'Consolas', 'JetBrains Mono', monospace; font-size: 12.5px; font-weight: 700; flex: 1; }
  .card-header .role-tag { font-size: 9px; font-weight: 700; color: #fff; padding: 2px 6px; border-radius: 10px; }
  .card-body { padding: 5px 0; }
  .field-row { display: flex; align-items: center; gap: 7px; padding: 3px 12px; font-size: 10.5px; }
  .field-badge { font-family: 'Consolas', monospace; font-size: 8px; font-weight: 700; padding: 1px 5px; border-radius: 3px; min-width: 22px; text-align: center; }
  .pk { background: #ffe8e0; color: #cf3b1d; }
  .fk { background: #dbeeff; color: #1868b8; }
  .fd { background: transparent; color: transparent; min-width: 22px; }
  .field-name { font-family: 'Consolas', monospace; flex: 1; }
  .field-type { color: #8c959f; font-size: 9.5px; }
</style>
</head>
<body>

<div id="title">
  <h1>Sơ đồ rút gọn — Năm học, Học kỳ &amp; Tuần học</h1>
  <p>Admin/Giáo vụ (quản lý) · Giáo viên (xem) — nền tảng thời gian dùng chung toàn hệ thống</p>
</div>

<div id="canvas-wrap">
  <div id="canvas">
    <svg id="svg-lines" width="700" height="420"></svg>
  </div>
</div>

<script>
const TABLES = {
  hoc_ky: {
    color: '#b35900', roleTag: null,
    fields: [
      { k: 'pk', n: 'id', t: 'int' },
      { k: 'fk', n: 'nam_hoc_id', t: 'int' },
      { n: 'ten_hoc_ky', t: 'varchar' },
      { n: 'ngay_bat_dau', t: 'date' },
    ],
  },
  nam_hoc: {
    color: '#b35900', roleTag: null,
    fields: [
      { k: 'pk', n: 'id', t: 'int' },
      { n: 'ten_nam_hoc', t: 'varchar' },
    ],
  },
  tuan_hoc: {
    color: '#b35900', roleTag: null,
    fields: [
      { k: 'pk', n: 'id', t: 'int' },
      { k: 'fk', n: 'nam_hoc_id', t: 'int' },
      { n: 'ma_tuan', t: 'varchar' },
      { n: 'so_thu_tu_tuan', t: 'int' },
    ],
  },
};

const POSITIONS = {
  hoc_ky:   { x: 30,  y: 20 },
  nam_hoc:  { x: 340, y: 150 },
  tuan_hoc: { x: 30,  y: 280 },
};

const RELATIONS = [
  ['hoc_ky', 'thuộc năm học', 'nam_hoc'],
  ['tuan_hoc', 'thuộc năm học', 'nam_hoc'],
];

const canvas = document.getElementById('canvas');
const svg = document.getElementById('svg-lines');
const cardEls = {};

Object.entries(TABLES).forEach(([name, def]) => {
  const pos = POSITIONS[name];
  const card = document.createElement('div');
  card.className = 'table-card';
  card.id = 'tbl_' + name;
  card.style.left = pos.x + 'px';
  card.style.top = pos.y + 'px';
  const fieldsHTML = def.fields.map(f => `
    <div class="field-row">
      <span class="field-badge ${f.k || 'fd'}">${f.k ? f.k.toUpperCase() : ''}</span>
      <span class="field-name">${f.n}</span>
      <span class="field-type">${f.t}</span>
    </div>`).join('');
  card.innerHTML = `
    <div class="card-header" style="background:${def.color}14; border-bottom-color:${def.color}44;">
      <div class="dot" style="background:${def.color};"></div>
      <span class="table-name">${name}</span>
      ${def.roleTag ? `<span class="role-tag" style="background:${def.color};">${def.roleTag}</span>` : ''}
    </div>
    <div class="card-body">${fieldsHTML}</div>
  `;
  canvas.appendChild(card);
  cardEls[name] = card;
});

function getCardBox(name) {
  const el = cardEls[name];
  return { x: parseInt(el.style.left), y: parseInt(el.style.top), w: el.offsetWidth, h: el.offsetHeight };
}

function drawLines() {
  svg.innerHTML = '';
  RELATIONS.forEach(([from, label, to, t]) => {
    const a = getCardBox(from);
    const b = getCardBox(to);
    const dx = (b.x + b.w / 2) - (a.x + a.w / 2);
    const ax = dx > 0 ? a.x + a.w : a.x;
    const bx = dx > 0 ? b.x : b.x + b.w;
    const ay = a.y + a.h / 2;
    const by = b.y + b.h / 2;
    const cx = (ax + bx) / 2;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M${ax},${ay} C${cx},${ay} ${cx},${by} ${bx},${by}`);
    path.setAttribute('class', 'rel-line');
    svg.appendChild(path);
    const tt = t ?? 0.5;
    const mx = ax + tt * (bx - ax), my = ay + tt * (by - ay);
    const bgRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', mx);
    text.setAttribute('y', my - 4);
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('class', 'rel-label');
    text.textContent = label;
    svg.appendChild(text);
    const bbox = text.getBBox();
    bgRect.setAttribute('x', bbox.x - 3);
    bgRect.setAttribute('y', bbox.y - 1);
    bgRect.setAttribute('width', bbox.width + 6);
    bgRect.setAttribute('height', bbox.height + 2);
    bgRect.setAttribute('class', 'rel-label-bg');
    svg.insertBefore(bgRect, text);
  });
}

drawLines();
</script>
</body>
</html>
