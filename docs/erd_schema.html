<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>ERD - University Portal Schema</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap');

  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #7d8590;
    --pk: #f78166;
    --fk: #79c0ff;

    --c1: #388bfd; /* Tài khoản */
    --c2: #3fb950; /* Đào tạo */
    --c3: #d2a8ff; /* Thời gian & Học vụ */
    --c4: #ffa657; /* Điểm & Học bạ */
    --c5: #ff7b72; /* TKB & Học phí */
    --c6: #79c0ff; /* Thông báo */
    --c7: #56d364; /* Biên bản SHCN */
    --c8: #e3b341; /* Hành chính */
    --c9: #bc8cff; /* Khảo sát */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    font-family: 'Be Vietnam Pro', sans-serif;
    color: var(--text);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    user-select: none;
  }

  /* TOOLBAR */
  #toolbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 48px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
    z-index: 1000;
  }
  #toolbar h1 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .05em;
    color: var(--text);
    flex: 1;
  }
  #toolbar span { color: var(--muted); font-size: 11px; }

  .legend {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  .leg-item {
    display: flex; align-items: center; gap: 4px;
    font-size: 10px; color: var(--muted);
  }
  .leg-dot {
    width: 8px; height: 8px; border-radius: 2px;
  }

  .btn {
    background: var(--border);
    border: none; color: var(--text);
    padding: 4px 10px; border-radius: 4px;
    font-size: 11px; cursor: pointer;
    font-family: inherit;
  }
  .btn:hover { background: #3d4450; }

  /* CANVAS */
  #canvas-wrap {
    position: fixed;
    top: 48px; left: 0; right: 0; bottom: 0;
    overflow: hidden;
    cursor: grab;
  }
  #canvas-wrap.grabbing { cursor: grabbing; }

  #canvas {
    position: absolute;
    transform-origin: 0 0;
  }

  /* SVG LINES */
  #svg-lines {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
    overflow: visible;
  }
  .rel-line {
    fill: none;
    stroke: #30363d;
    stroke-width: 1.5;
    opacity: 0.7;
  }
  .rel-line.highlight {
    stroke: #ffd700;
    stroke-width: 2.5;
    opacity: 1;
  }

  /* TABLE CARDS */
  .table-card {
    position: absolute;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    min-width: 190px;
    cursor: move;
    transition: box-shadow 0.15s;
    z-index: 10;
  }
  .table-card:hover {
    box-shadow: 0 0 0 1px var(--border), 0 8px 24px rgba(0,0,0,.5);
    z-index: 20;
  }
  .table-card.dragging {
    box-shadow: 0 0 0 2px #fff3, 0 16px 40px rgba(0,0,0,.7);
    z-index: 100;
  }

  .card-header {
    padding: 7px 10px;
    border-radius: 7px 7px 0 0;
    display: flex;
    align-items: center;
    gap: 6px;
    border-bottom: 1px solid var(--border);
  }
  .card-header .table-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    flex: 1;
  }
  .card-header .row-count {
    font-size: 9px;
    color: rgba(255,255,255,0.5);
    background: rgba(0,0,0,0.3);
    padding: 1px 5px;
    border-radius: 10px;
  }

  .card-body {
    padding: 4px 0;
  }

  .field-row {
    display: flex;
    align-items: center;
    padding: 2px 10px;
    gap: 6px;
    font-size: 10px;
  }
  .field-row:hover { background: rgba(255,255,255,0.04); }

  .field-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    font-weight: 700;
    padding: 1px 4px;
    border-radius: 3px;
    min-width: 22px;
    text-align: center;
  }
  .pk { background: rgba(247,129,102,0.2); color: var(--pk); }
  .fk { background: rgba(121,192,255,0.2); color: var(--fk); }
  .fd { background: transparent; color: transparent; min-width: 22px; }

  .field-name {
    font-family: 'JetBrains Mono', monospace;
    color: var(--text);
    flex: 1;
    font-size: 10px;
  }
  .field-type {
    color: var(--muted);
    font-size: 9px;
  }

  /* ZOOM */
  #zoom-ctrl {
    position: fixed;
    bottom: 16px; right: 16px;
    display: flex; gap: 4px;
    z-index: 999;
  }
  #zoom-ctrl button {
    width: 30px; height: 30px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
  }
  #zoom-ctrl button:hover { background: #2d333b; }
  #zoom-info {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 0 8px;
    font-size: 11px;
    display: flex; align-items: center;
    font-family: 'JetBrains Mono', monospace;
  }

  /* GROUP LABELS */
  .group-label {
    position: absolute;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    opacity: 0.35;
    pointer-events: none;
  }
</style>
</head>

  ['diem_ren_luyen','hoc_ky_id','hoc_ky'],
  ['thoi_khoa_bieu','lop_hp_id','lop_hoc_phan'],
  ['thoi_khoa_bieu','tuan_hoc_id','tuan_hoc'],
  ['hoc_phi','sinh_vien_id','sinh_vien'],
  ['hoc_phi','hoc_ky_id','hoc_ky'],
  ['thong_bao','nguoi_tao_id','tai_khoan'],
  ['thong_bao','lop_nhan_id','lop_sinh_hoat'],
  ['thong_bao_da_doc','thong_bao_id','thong_bao'],
  ['thong_bao_da_doc','tai_khoan_id','tai_khoan'],
  ['binh_luan_thong_bao','thong_bao_id','thong_bao'],
  ['binh_luan_thong_bao','tai_khoan_id','tai_khoan'],
  ['bien_ban_shcn','lop_id','lop_sinh_hoat'],
  ['bien_ban_shcn','tuan_hoc_id','tuan_hoc'],
  ['bien_ban_shcn','gvcn_id','giao_vien'],
  ['bien_ban_shcn','thu_ky_id','sinh_vien'],
  ['chi_tiet_cong_viec','bien_ban_id','bien_ban_shcn'],
  ['chi_tiet_vang_shcn','bien_ban_id','bien_ban_shcn'],
  ['chi_tiet_vang_shcn','sinh_vien_id','sinh_vien'],
  ['yeu_cau_hanh_chinh','sinh_vien_id','sinh_vien'],
  ['yeu_cau_hanh_chinh','nguoi_duyet_id','tai_khoan'],
  ['yeu_cau_sua_diem','lop_hp_id','lop_hoc_phan'],
  ['yeu_cau_sua_diem','giao_vien_id','giao_vien'],
  ['yeu_cau_sua_diem','nguoi_duyet_id','tai_khoan'],
  ['dat_phong_thuc_hanh','giao_vien_id','giao_vien'],
  ['dat_phong_thuc_hanh','nguoi_duyet_id','tai_khoan'],
  ['khao_sat_y_kien','sinh_vien_id','sinh_vien'],
  ['khao_sat_y_kien','lop_hp_id','lop_hoc_phan'],
  ['dien_dan_giao_vien','lop_id','lop_sinh_hoat'],
  ['dien_dan_giao_vien','giao_vien_id','giao_vien'],
];

// Initial positions (x, y) per table
const POSITIONS = {
  // Group 1: Tài khoản (left side)
  vai_tro:         { x: 40,   y: 80  },
  phong_ban:       { x: 40,   y: 200 },
  tai_khoan:       { x: 230,  y: 80  },
  giao_vien:       { x: 490,  y: 80  },
  sinh_vien:       { x: 490,  y: 260 },
  ket_qua_anh_van_dau_vao: { x: 700, y: 260 },

  // Group 2: Đào tạo (middle-top)
  nganh_hoc:       { x: 940,  y: 80  },
  chuong_trinh_dt: { x: 1140, y: 80  },
  mon_hoc:         { x: 1350, y: 80  },
  lop_sinh_hoat:   { x: 700,  y: 80  },
  chi_tiet_ctdt:   { x: 1140, y: 260 },

  // Group 3: Thời gian & Học vụ
  nam_hoc:         { x: 40,   y: 460 },
  hoc_ky:          { x: 230,  y: 460 },
  tuan_hoc:        { x: 460,  y: 460 },
  lop_hoc_phan:    { x: 700,  y: 460 },

  // Group 4: Điểm
  danh_sach_lop_hp:  { x: 940,  y: 460 },
  danh_sach_thi_lai: { x: 1200, y: 460 },
  hoc_ba:            { x: 940,  y: 720 },
  diem_ren_luyen:    { x: 1200, y: 720 },

  // Group 5: TKB & Học phí
  thoi_khoa_bieu:  { x: 40,   y: 720 },
  hoc_phi:         { x: 260,  y: 720 },

  // Group 6: Thông báo
  thong_bao:            { x: 460,  y: 720 },
  thong_bao_da_doc:     { x: 700,  y: 720 },
  binh_luan_thong_bao:  { x: 700,  y: 900 },

  // Group 7: SHCN
  bien_ban_shcn:       { x: 40,   y: 980 },
  chi_tiet_cong_viec:  { x: 280,  y: 980 },
  chi_tiet_vang_shcn:  { x: 470,  y: 980 },

  // Group 8: Hành chính
  yeu_cau_hanh_chinh:  { x: 700,  y: 1060 },
  yeu_cau_sua_diem:    { x: 940,  y: 1060 },
  dat_phong_thuc_hanh: { x: 1160, y: 1060 },

  // Group 9: Khảo sát
  khao_sat_y_kien:    { x: 940,  y: 900 },
  dien_dan_giao_vien: { x: 460,  y: 900 },
};

// ============================================================
// RENDER
// ============================================================
const canvas = document.getElementById('canvas');
const svg = document.getElementById('svg-lines');

// Map table -> color
const tableColor = {};
Object.values(GROUPS).forEach(g => g.tables.forEach(t => tableColor[t] = g.color));

// Create cards
const cardEls = {};
Object.entries(TABLES).forEach(([name, def]) => {
  const color = tableColor[name] || '#888';
  const pos = POSITIONS[name] || { x: 100, y: 100 };

  const card = document.createElement('div');
  card.className = 'table-card';
  card.id = 'tbl_' + name;
  card.style.left = pos.x + 'px';
  card.style.top = pos.y + 'px';

  const fieldsHTML = def.fields.map(f => `
    <div class="field-row">
      <span class="field-badge ${f.k || 'fd'}">${f.k ? f.k.toUpperCase() : ''}</span>
      <span class="field-name">${f.n}</span>
      <span class="field-type">${f.t}</span>
    </div>`).join('');

  card.innerHTML = `
    <div class="card-header" style="background:${color}22; border-bottom-color:${color}44;">
      <div style="width:8px;height:8px;border-radius:2px;background:${color};flex-shrink:0;"></div>
      <span class="table-name">${name}</span>
      <span class="row-count">${def.fields.length} cols</span>
    </div>
    <div class="card-body">${fieldsHTML}</div>
  `;

  canvas.appendChild(card);
  cardEls[name] = card;
});

// ============================================================
// DRAG CARDS
// ============================================================
let dragging = null, dragOX = 0, dragOY = 0;

Object.entries(cardEls).forEach(([name, card]) => {
  card.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    e.stopPropagation();
    dragging = { name, card };
    const rect = card.getBoundingClientRect();
    const wrap = document.getElementById('canvas-wrap').getBoundingClientRect();
    dragOX = (e.clientX - wrap.left - panX) / scale - parseInt(card.style.left);
    dragOY = (e.clientY - wrap.top  - panY) / scale - parseInt(card.style.top);
    card.classList.add('dragging');
  });
});

document.addEventListener('mousemove', e => {
  if (!dragging) return;
  const wrap = document.getElementById('canvas-wrap').getBoundingClientRect();
  const nx = (e.clientX - wrap.left - panX) / scale - dragOX;
  const ny = (e.clientY - wrap.top  - panY) / scale - dragOY;
  dragging.card.style.left = nx + 'px';
  dragging.card.style.top  = ny + 'px';
  drawLines();
});

document.addEventListener('mouseup', () => {
  if (dragging) {
    dragging.card.classList.remove('dragging');
    dragging = null;
  }
  isPanning = false;
  document.getElementById('canvas-wrap').classList.remove('grabbing');
});

// ============================================================
// PAN & ZOOM
// ============================================================
let scale = 0.72, panX = 20, panY = 10;
let isPanning = false, panSX = 0, panSY = 0;

function applyTransform() {
  canvas.style.transform = `translate(${panX}px,${panY}px) scale(${scale})`;
  document.getElementById('zoom-info').textContent = Math.round(scale * 100) + '%';
}

const wrap = document.getElementById('canvas-wrap');

wrap.addEventListener('mousedown', e => {
  if (e.button === 0 && !dragging) {
    isPanning = true;
    panSX = e.clientX - panX;
    panSY = e.clientY - panY;
    wrap.classList.add('grabbing');
  }
});

document.addEventListener('mousemove', e => {
  if (!isPanning || dragging) return;
  panX = e.clientX - panSX;
  panY = e.clientY - panSY;
  applyTransform();
});

wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.08 : 0.08;
  const rect = wrap.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const newScale = Math.min(2, Math.max(0.2, scale + delta));
  panX = mx - (mx - panX) * (newScale / scale);
  panY = my - (my - panY) * (newScale / scale);
  scale = newScale;
  applyTransform();
  drawLines();
}, { passive: false });

function zoom(d) {
  scale = Math.min(2, Math.max(0.2, scale + d));
  applyTransform();
  drawLines();
}

function resetView() {
  scale = 0.72; panX = 20; panY = 10;
  applyTransform();
  drawLines();
}

// ============================================================
// DRAW LINES
// ============================================================
function getCardCenter(name) {
  const el = cardEls[name];
  if (!el) return null;
  const x = parseInt(el.style.left) + el.offsetWidth / 2;
  const y = parseInt(el.style.top) + el.offsetHeight / 2;
  return { x, y, w: el.offsetWidth, h: el.offsetHeight,
           left: parseInt(el.style.left), top: parseInt(el.style.top) };
}

function drawLines() {
  svg.innerHTML = '';
  RELATIONS.forEach(([from, , to]) => {
    if (from === to) return;
    const a = getCardCenter(from);
    const b = getCardCenter(to);
    if (!a || !b) return;

    // Pick edge points
    const dx = b.x - a.x;
    const ax = dx > 0 ? a.left + a.w : a.left;
    const bx = dx > 0 ? b.left : b.left + b.w;
    const ay = a.top + a.h / 2;
    const by = b.top + b.h / 2;
    const cx = (ax + bx) / 2;

    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', `M${ax},${ay} C${cx},${ay} ${cx},${by} ${bx},${by}`);
    path.setAttribute('class','rel-line');
    svg.appendChild(path);
  });
}

applyTransform();
setTimeout(drawLines, 100);
</script>
